// Deadlock autoexec - managed by the VW repo (config/autoexec.cfg).
// Applied to <Deadlock>/game/citadel/cfg/autoexec.cfg by
// tools/Apply-DeadlockConfig.ps1. Edit the repo copy, never the game copy.
// Runs at launch when Steam launch options carry: +exec autoexec
// Only player-settable cvars (no sv_cheats, no dev-only). An unknown cvar only
// prints "Unknown command" in the console; drop it from here once seen.
// Rationale and rollback: docs/optimization.md.

// Console on (the game's own Settings option), so this file can be verified.
con_enable true

// Frame cap: display is 2560x1440 at 240 Hz. Cap 3 below refresh keeps a
// G-SYNC / FreeSync display inside its VRR window with V-Sync off and avoids
// the latency jump of hitting the V-Sync ceiling. Menus need far less.
fps_max 237
fps_max_ui 120

// Network: the maximum client rate (bytes/s) the engine accepts.
rate 786432

// Frame pacing: sleep after the client tick, not before present (latency).
engine_low_latency_sleep_after_client_tick true

// Controls (docs/controls.md): sensitivity. The game mirrors it into the
// cloud hero-settings file (base mouse_sensitivity), so it sticks.
// Sensitivity: Source yaw 0.022; at 1200 DPI (R110 step 2 of 3, operator's call
// 2026-10-25) eDPI 1920 = 21.6 cm/360,
// sized to the ~22 cm usable pad width (docs/controls.md).
sensitivity 1.6
sensitivity_y_scale 1
zoom_sensitivity_ratio 1

// Reticle: NOT set here. The game keeps the reticle in the cloud file
// remote/cfg/citadel_hero_settings.lst (base crosshair_*) and pushes it over
// the citadel_crosshair_* cvars, so autoexec values never showed (menu read
// default 2026-10-25 23:01). Set it in Settings > Game > Reticle.

echo "[VW] autoexec loaded (fps_max 237, sens 1.6)"
