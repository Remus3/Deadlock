# VW CI - two tiers (gh-review 2026-10-25 lessons).
#
# Tier 1 "fast" (ubuntu, every qualifying push / PR): privacy scan of every
# tracked file, byte-compile, the pytest suite (Windows-only tests skip).
# Tier 2 "windows" (windows-latest): the full suite including the PowerShell
# 5.1 parse check - only on pull requests, the weekly schedule and manual
# dispatch, never on a plain push (the local gate already ran it).
# paths-ignore keeps docs-only pushes free; concurrency cancels a superseded
# run of the same ref and event.

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '*.txt'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '*.txt'
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: tier 1 - privacy, compile, suite (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - run: python tools/vw_privacy.py scan
      - run: python -m compileall -q tools tests
      - run: python -m pytest -q

  windows:
    name: tier 2 - full suite + PowerShell 5.1 parse (windows)
    needs: fast
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - run: python -m pytest -q
